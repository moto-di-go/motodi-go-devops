services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  object-storage:
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

  redis:
    restart: unless-stopped

  backend-core:
    image: ${REGISTRY:-ghcr.io/motodi-go}/motodi-go-backend-core:${IMAGE_TAG:-staging}
    build: !reset null
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER_URL: ${JWT_ISSUER_URL:?JWT_ISSUER_URL is required}
      OTP_PROVIDER: africas-talking
      OTP_PEPPER: ${OTP_PEPPER:?OTP_PEPPER is required}
      AFRICAS_TALKING_USERNAME: ${AFRICAS_TALKING_USERNAME:?AFRICAS_TALKING_USERNAME is required}
      AFRICAS_TALKING_API_KEY: ${AFRICAS_TALKING_API_KEY:?AFRICAS_TALKING_API_KEY is required}
      AFRICAS_TALKING_SENDER_ID: ${AFRICAS_TALKING_SENDER_ID:?AFRICAS_TALKING_SENDER_ID is required}
      GIS_ROUTES_YAOUNDE_PATH: ${GIS_ROUTES_YAOUNDE_PATH:-/app/data/gis/routes_yaounde.gpkg}

  backend-ai:
    image: ${REGISTRY:-ghcr.io/motodi-go}/motodi-go-backend-ai:${IMAGE_TAG:-staging}
    build: !reset null
    restart: unless-stopped
    environment:
      ENVIRONMENT: staging
      BACKEND_CORE_BASE_URL: http://backend-core:8081

  api-gateway:
    image: ${REGISTRY:-ghcr.io/motodi-go}/motodi-go-api-gateway:${IMAGE_TAG:-staging}
    build: !reset null
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SERVER_PORT: 8080
      BACKEND_CORE_BASE_URL: http://backend-core:8081
      BACKEND_AI_BASE_URL: http://backend-ai:8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER_URL: ${JWT_ISSUER_URL:?JWT_ISSUER_URL is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-motodi-go-api}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_AUTH_CAPACITY: ${GATEWAY_RATE_LIMIT_AUTH_CAPACITY:-5}
      GATEWAY_RATE_LIMIT_AUTH_REFILL_TOKENS: ${GATEWAY_RATE_LIMIT_AUTH_REFILL_TOKENS:-1}
      GATEWAY_RATE_LIMIT_AUTH_REFILL_PERIOD_SECONDS: ${GATEWAY_RATE_LIMIT_AUTH_REFILL_PERIOD_SECONDS:-120}
      GATEWAY_RATE_LIMIT_OTP_CAPACITY: ${GATEWAY_RATE_LIMIT_OTP_CAPACITY:-5}
      GATEWAY_RATE_LIMIT_OTP_REFILL_TOKENS: ${GATEWAY_RATE_LIMIT_OTP_REFILL_TOKENS:-1}
      GATEWAY_RATE_LIMIT_OTP_REFILL_PERIOD_SECONDS: ${GATEWAY_RATE_LIMIT_OTP_REFILL_PERIOD_SECONDS:-120}
      GATEWAY_RATE_LIMIT_PAYMENT_CAPACITY: ${GATEWAY_RATE_LIMIT_PAYMENT_CAPACITY:-10}
      GATEWAY_RATE_LIMIT_PAYMENT_REFILL_TOKENS: ${GATEWAY_RATE_LIMIT_PAYMENT_REFILL_TOKENS:-10}
      GATEWAY_RATE_LIMIT_PAYMENT_REFILL_PERIOD_SECONDS: ${GATEWAY_RATE_LIMIT_PAYMENT_REFILL_PERIOD_SECONDS:-60}
      GATEWAY_RATE_LIMIT_CALLBACK_CAPACITY: ${GATEWAY_RATE_LIMIT_CALLBACK_CAPACITY:-60}
      GATEWAY_RATE_LIMIT_CALLBACK_REFILL_TOKENS: ${GATEWAY_RATE_LIMIT_CALLBACK_REFILL_TOKENS:-60}
      GATEWAY_RATE_LIMIT_CALLBACK_REFILL_PERIOD_SECONDS: ${GATEWAY_RATE_LIMIT_CALLBACK_REFILL_PERIOD_SECONDS:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}

  admin-dashboard:
    image: ${REGISTRY:-ghcr.io/motodi-go}/motodi-go-admin-dashboard:${IMAGE_TAG:-staging}
    build: !reset null
    restart: unless-stopped
    environment:
      PUBLIC_APP_ENV: staging
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
