services:
  postgres:
    restart: unless-stopped

  object-storage:
    restart: unless-stopped

  backend-core:
    image: ${REGISTRY:-ghcr.io/motodi-go}/motodi-go-backend-core:${IMAGE_TAG:-staging}
    build: !reset null
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SERVER_PORT: 8081

  backend-ai:
    image: ${REGISTRY:-ghcr.io/motodi-go}/motodi-go-backend-ai:${IMAGE_TAG:-staging}
    build: !reset null
    restart: unless-stopped
    environment:
      ENVIRONMENT: staging
      BACKEND_CORE_BASE_URL: http://backend-core:8081

  api-gateway:
    image: ${REGISTRY:-ghcr.io/motodi-go}/motodi-go-api-gateway:${IMAGE_TAG:-staging}
    build: !reset null
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SERVER_PORT: 8080

  admin-dashboard:
    image: ${REGISTRY:-ghcr.io/motodi-go}/motodi-go-admin-dashboard:${IMAGE_TAG:-staging}
    build: !reset null
    restart: unless-stopped
    environment:
      PUBLIC_APP_ENV: staging
